# ===========================================
# SFTP Server Spring Boot Application
# ===========================================

spring.application.name=SFTP-Project
# Active profile (use 'prod' for production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ===========================================
# Server Configuration
# ===========================================
server.port=${SERVER_PORT:8080}
# Session Configuration
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# ===========================================
# SFTP Server Configuration
# ===========================================
sftp.enabled=${SFTP_ENABLED:true}
sftp.port=${SFTP_PORT:2222}
sftp.host-key-path=${SFTP_HOST_KEY_PATH:hostkey.ser}
sftp.base-directory=${SFTP_BASE_DIRECTORY:${java.io.tmpdir}/sftp-files}
sftp.idle-timeout=${SFTP_IDLE_TIMEOUT:300000}
# SFTP Users (format: user1:password1,user2:password2)
# For production, use BCrypt hashed passwords starting with $2a$
sftp.users=${SFTP_USERS:}
# ===========================================
# Web Application Configuration
# ===========================================
app.upload.directory=${APP_UPLOAD_DIRECTORY:${java.io.tmpdir}/sftp-files}
# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
# Session Configuration
app.session.timeout-minutes=${SESSION_TIMEOUT_MINUTES:30}
app.session.max-sessions=${MAX_SESSIONS:1}
# Web Users (format: username:password:ROLE,username:password:ROLE)
# For production, use BCrypt hashed passwords starting with $2a$
app.web.users=${WEB_USERS:}
# ===========================================
# File Upload Configuration
# ===========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
# ===========================================
# Thymeleaf Configuration
# ===========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
# ===========================================
# Logging Configuration
# ===========================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.com.sftp=${APP_LOG_LEVEL:INFO}
# Log pattern for console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# ===========================================
# Error Handling
# ===========================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
